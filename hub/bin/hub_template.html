<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Claude Agents Manager</title>
<!-- 파비콘은 허브 서버가 /, /hub.html 외 경로를 서빙하지 않고 file:// 로도 열려야 해서 인라인 data: URI 로 넣는다.
     SVG 색은 data: URI 프래그먼트 구분자(#)로 오인되지 않게 rgb() 표기를 쓰고, 속성 인용은
     바깥 href 의 큰따옴표와 겹치지 않도록 홑따옴표를 쓴다(둘 다 안전해 추가 퍼센트 인코딩은 불필요).
     연결선은 넣지 않는다: 16px 실측 렌더에서 중앙 원과 겹쳐 "Y자/뿔" 모양으로 뭉개짐이 확인됐다. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='rgb(0,114,178)'/><circle cx='16' cy='16' r='4.6' fill='white'/><circle cx='16.0' cy='6.8' r='3.0' fill='white'/><circle cx='24.0' cy='20.6' r='3.0' fill='white'/><circle cx='8.0' cy='20.6' r='3.0' fill='white'/></svg>">
<!--
DZH:HUB 데이터 계약
  #dzh-data : application/json 스크립트. HubSnapshot 을 그대로 담는다(snake_case 그대로).
              hub_model.render_hub_html 이 이 블록 하나만 치환한다. 나머지는 정적이다.
  갱신 모드는 /dashboard 와 같은 판정이다: location.protocol 이 http(s) 면 1분 폴링
  (자기 URL 을 받아 문자열 전체 비교), 아니면 포커스 복귀 시 location.reload(). 두 모드
  모두 #dzh-refresh 버튼과 포커스 복귀 시에도 같은 즉시 갱신 경로를 탄다.

  불변식 H1⁗(정본: docs/prps/hub-detail-side-panel.md 결정 SP6). 폴링·틱이 내용을
  갱신하는 대상은 #dzh-app(자식 전체 교체) · #dzh-usage-body(innerHTML) ·
  #dzh-usage-summary(textContent) · #dzh-refresh 의 data-tooltip·class 속성뿐이다.
  다음 노드는 정적이며 폴링이 절대 교체하지 않는다: #dzh-usage, #dzh-usage-toggle,
  #dzh-theme-toggle, #dzh-tooltip, #dzh-detail-panel(과 그 자식 전부).
  이들의 갱신은 속성·textContent 단위로만 한다. 여기에 세 조항이 더해진다 —
  ① 순서는 데이터가 아니라 사용자 상태다: #dzh-app 자식의 배치 순서는 스냅샷이 아니라
  storedProjectOrder(모듈 스코프 + localStorage['dzh-project-order'])가 정한다. 서버의
  활동순 정렬은 아직 저장 순서에 없는 신규 프로젝트끼리의 상대 순서를 정할 때만 쓰인다.
  ② 드래그 중에는 다시 그리지 않는다 — isReordering 이 참이면 render() 는 즉시 반환한다.
  그 사이 dragover 가 #dzh-app 자식의 순서를 직접 바꾸며(라이브 이동), 따라서 드래그
  구간에서는 DOM 이 저장 순서보다 앞서 있다. drop 이 그 DOM 순서를 커밋하고, dragend 가
  한 번 다시 그려 둘을 맞춘다. 취소·카드 밖 드롭은 drop 없이 dragend 만 발화하므로 재렌더가
  라이브 이동을 자동으로 되돌린다. ③ 밀어내기는 body 의 클래스 하나로만 표현한다 —
  #dzh-app 이나 카드에는 패널 열림 상태를 반영하지 않는다. 반영하는 순간 매 렌더마다 그
  상태를 다시 계산해야 하고, 두 IIFE 의 독립성이 깨진다. 원칙은 그대로다 — 사용자 상태
  (포커스·접힘·선택·순서·열린 상세 패널)를 가진 것은 재렌더 대상 밖에 둔다. ④ 닫기는
  PANEL_CLOSE_ANIMATION_MS 동안의 슬라이드아웃이며 그 사이 iframe 을 비우지 않는다.
  about:blank 는 같은 시간만큼 지연 실행되고, 대기 중인 그 타이머가 존재하면
  openDashboardKey 는 반드시 null 이다 — 취소는 openDetailPanel 한 곳에서만 한다(SP15).

  #dzh-detail-note 는 패널의 정적 자식이며 detail-note-visible 클래스만 바뀐다(결정 GN6~GN7
  → docs/prps/hub-panel-polish-and-icons.md 결정 PV3). 문구와 data-tooltip 은 마크업에
  고정돼 있고, 자리는 안내 유무와 무관하게 항상 예약된다 — 그 예약된 자리가 헤드와 대시보드
  카드를 가르는 여백을 겸한다(결정 PV2). 그 값의 출처는 스냅샷이 아니라 클릭된
  카드의 data-tier1-previous 속성이다 — 패널 IIFE 가 스냅샷을 모른다는 결정 SP1 을 유지하기
  위한 우회다.

  아이콘은 lucide(ISC, https://lucide.dev)의 path 좌표를 그대로 옮겨 적은 정적 인라인
  SVG 다 — CDN·런타임 라이브러리를 쓰지 않는다(file:// 로도 열려야 하기 때문, 결정 PV9).
  viewBox·stroke 속성 관용구는 새로고침 버튼(refresh-cw)이 세운 선례를 그대로 따른다.

  #dzh-usage 와 그 안의 #dzh-usage-toggle 은 정적 노드이며 class·aria-expanded 속성만
  갱신한다(노드 교체 금지). 접힘을 바꾸는 경로는 둘이다 — 제목 줄 클릭과 패널 바깥 클릭 —
  이며 둘 다 같은 함수(applyUsageCollapsedState)와 같은 저장 키를 쓴다. 패널 안에는 원칙적으로
  툴팁 트리거를 두지 않는다(R5, 결정 UT1) — 유일한 예외가 만료 안내 줄(.usage-stale-note)
  이고(R-B, 결정 EX7), 그래서 tooltipDismissObserver 의 #dzh-usage-body 관찰이 그 트리거를
  위해 되살아나 있다. 테마 토글 버튼은 이들 바깥의 정적 마크업이라 폴링과 무관하게
  DOM 이 그대로 유지된다. rate_limit_resets(있으면)는 펼침 본문에 초기화 예정 시각 줄로
  더해진다(docs/prps/hub-usage-reset-time-and-refresh.md). usage·rate_limit_resets 의 값은
  모두 같은 statusLine 캡처(rate_limits.json) 하나에서 온다 — 퍼센트와 초기화 예정 시각을
  서로 다른 출처로 오해하지 말 것(docs/prps/hub-card-cleanup-and-usage-source.md 결정 P1·P3).
  #dzh-tooltip 은 전역 커스텀 툴팁의 정적 싱글턴이다(위 네 요소 바깥, docs/prps/
  hub-session-activity-and-tooltip.md). 폴링 대상이 아니다 — 사용자 상호작용(hover·focus)만
  내용을 바꾼다. 트리거는 data-tooltip="…" 속성을 가진 임의의 요소이며, 리스너는 재렌더로
  죽지 않도록 document 에 위임한다.
  프로젝트 상세 패널(#dzh-detail-panel, docs/prps/hub-detail-side-panel.md 결정 SP1)은
  비모달 <aside> 정적 싱글턴이다. 카드 클릭이 iframe 문서와 제목만 바꾸고, 닫힘에서 iframe 을
  about:blank 로 보내 숨은 폴링을 멈춘다. 열림 상태의 유일한 진실은 패널 IIFE 의
  openDashboardKey 이며 body.dzh-panel-open 은 그 값의 CSS 투영이다.
-->
<style>
  :root{
    color-scheme:light;
    --bg:#EEF3F8;--surface:#FFFFFF;--ink:#172033;--head:#12335B;--muted:#5A6879;
    --line:#D9E2EC;--soft:#F4F7FB;
    --accent:#0072B2;--accent-ink:#005B8F;--accent-soft:#E4F0F8;
    --attention:#B45309;--attention-soft:#FBEEDC;
    --shadow:0 8px 24px rgba(19,51,91,.06);
    /* 패널 폭(SP19, 초판 SP4 번복). 밀어내기 폭·.usage 이동량이 같은 값을 쓰게 하는 단일 출처다. */
    --dzh-panel-width:550px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0E1621;--surface:#16202D;--ink:#E6EDF5;--head:#DCE7F2;--muted:#94A5B8;
      --line:#26364A;--soft:#1B2634;
      --accent:#56B4E9;--accent-ink:#8ACBF0;--accent-soft:#12324A;
      --attention:#E69F00;--attention-soft:#3B2B0D;
      --shadow:0 8px 24px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0E1621;--surface:#16202D;--ink:#E6EDF5;--head:#DCE7F2;--muted:#94A5B8;
    --line:#26364A;--soft:#1B2634;
    --accent:#56B4E9;--accent-ink:#8ACBF0;--accent-soft:#12324A;
    --attention:#E69F00;--attention-soft:#3B2B0D;
    --shadow:0 8px 24px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
  .wrap{max-width:1440px;margin:32px auto;padding:0 16px}
  /* 최대 3열 — 트랙 최소폭을 (콘텐츠폭 − gap 2개)/3 로 올리면 4열이 산술적으로 불가능해진다.
     24px 은 같은 줄의 gap:12px 2개다(3열의 gap 개수) — gap 을 고치면 이 값도 같이 고쳐야 한다.
     -1px 은 서브픽셀 반올림이 비율을 3 아래로 떨어뜨려 2열로 붕괴하는 것을 막는 여유다(GOTCHA 1).
     max(320px, …) 가 좁은 폭에서는 종전 320px 을 그대로 쓰게 해 2·1열 반응형을 보존한다.
     (결정 W1, docs/prps/hub-card-cleanup-and-usage-source.md) */
  #dzh-app{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(320px,calc((100% - 24px)/3 - 1px)),1fr));gap:12px;align-items:start}
  #dzh-app>.empty,#dzh-app>.warnings{grid-column:1/-1}
  /* 헤더 버튼 클러스터(.top-actions)가 고정 위치에서 이 행 안으로 들어왔다(R5) —
     flex-wrap 은 360px 안팎의 극단적으로 좁은 화면에서 클러스터가 겹치는 대신 아래 줄로
     내려가게 한다. */
  .head-row{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}
  h1{font-size:20px;margin:0;color:var(--head);letter-spacing:-.4px}
  /* 340px 는 헤더 블록(project-head+path+tier1) + 세션 약 3개가 스크롤 없이 들어가도록 고른
     값이다 — 넘치는 세션은 .sessions 만 내부 스크롤된다. 카드 높이를 프로젝트마다 다르게
     만들지 않기 위한 고정값이라 근거 없이 바꾸지 마라. */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px;box-shadow:var(--shadow);height:340px;display:flex;flex-direction:column;overflow:hidden}
  /* 클릭 가능 ⇔ dashboard_key 존재(결정 N2) — 속성 존재만으로 커서를 바꿔 별도 클래스
     없이도 화면 상태와 데이터가 항상 일치하게 한다(R3). */
  .card[data-dashboard-key]{cursor:pointer}
  .card[data-dashboard-key]:hover{border-color:var(--accent)}
  /* 지금 작업중인 카드를 훑어 찾기 쉽게 하는 스캔 보조 신호(R3) — 배지의 텍스트+글리프+색
     3채널에 얹는 중복 신호라 새 접근성 부채가 아니다(결정 D4). box-shadow 는 --shadow(카드
     기본 그림자)를 먼저 유지한 뒤 두 번째 그림자로 halo 를 더한다 — 순서를 바꾸면 working
     카드만 기본 그림자를 잃어 평면이 된다. 은은한 pulse 는 사용자가 선택했다(결정 D3) —
     reduced-motion 에서는 정적 glow 로 낙착해 신호 자체는 잃지 않는다. */
  .card.card-working{border-color:var(--accent);box-shadow:var(--shadow),0 0 14px -2px var(--accent);animation:card-working-glow 2.6s ease-in-out infinite alternate}
  @keyframes card-working-glow{from{box-shadow:var(--shadow),0 0 10px -3px var(--accent)}to{box-shadow:var(--shadow),0 0 18px -1px var(--accent)}}
  @media (prefers-reduced-motion:reduce){.card.card-working{animation:none}}
  /* 드래그 중인 원본 카드(R7, 결정 DG6) — 고스트(반투명 복제)와 구분되도록 낮춘다. 놓일 자리가
     곧 이 카드의 현재 위치다(dragover 의 라이브 이동). dragend 가 render() 를 불러 카드를
     재생성하므로 클래스 제거 코드가 필요 없다 — 재렌더가 청소한다. opacity 는 컴포지터
     친화 속성이라 pulse(card-working)와 겹쳐도 추가 리페인트 부담이 없다. */
  .card.card-dragging{opacity:.55}
  .project-head{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
  /* 드래그 핸들(R2) — 카드 전체 클릭(R3)과 조작 영역이 겹치지 않도록 전용 요소로 둔다
     (결정 DG3 — 드래그 전용이라 button 이 아니라 aria-hidden 인 span 이다). 22px 는 인접
     배지들보다 살짝 작게 잡아 "잡는 곳"이라는 보조적 위계를 준다. */
  .card-drag-handle{width:22px;height:22px;flex:0 0 auto;padding:0;color:var(--muted);
                     background:transparent;border:1px solid var(--line);border-radius:6px;
                     cursor:grab;display:inline-flex;align-items:center;justify-content:center}
  .card-drag-handle:hover{color:var(--accent-ink);border-color:var(--accent)}
  .card-drag-handle svg{width:14px;height:14px}
  /* font:inherit 를 먼저 두고 font-size·font-weight 를 뒤에 다시 적어, <button> 기본 폰트만
     리셋하고 크기·굵기는 명시값을 쓰게 한다(순서 의존 — .usage-toggle 과 같은 관례). 티어
     2·3 은 <span> 으로 렌더돼(R3) 이 리셋은 그때 아무 효과가 없다. */
  .project-name{font:inherit;font-size:15px;font-weight:800;color:var(--head);overflow:hidden;
                text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto;
                border:0;background:none;padding:0;text-align:left}
  button.project-name{cursor:pointer}
  button.project-name:hover{color:var(--accent-ink)}
  button.project-name:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* inline-block 이던 시절엔 line-height 가 body(1.5)를 물려받아 패딩 위아래가 비대칭으로
     보였다(글리프·텍스트가 위로 치우침) — inline-flex+align-items:center 로 박스 기준
     중앙정렷하고 line-height:1 로 그 여백 자체를 없앤다. */
  .badge{display:inline-flex;align-items:center;line-height:1;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px}
  .badge .glyph{margin-right:3px}
  .project-head .badge{flex:0 0 auto}
  .badge.tier{background:var(--soft);color:var(--muted)}
  /* 상태 배지: box-shadow 왼쪽 바 대신 배경/테두리 형태로 상태를 구분한다(색맹 안전 색상+글리프는
     renderStateBadge 가 담당, 검수 M6). working 은 지금 진행 중이라 가장 눈에 띄어야 해서 채움
     배지로, stale 은 경고성이라 점선 테두리로, idle·done 은 평상시라 플랫/윤곽선으로 낮춘다.
     배경은 --accent-ink 를 쓴다 — 라이트 테마의 --accent(#0072B2)는 --bg 글자색과 대비가
     4.6:1 로 WCAG AA(4.5:1) 여유가 거의 없다. --accent-ink 는 두 테마 모두 --bg 와의 대비를
     넉넉히 확보하도록 이미 정의돼 있어(호버 텍스트용) 새 토큰 없이 재사용한다. */
  .badge.state-working{background:var(--accent-ink);color:var(--bg)}
  .badge.state-idle{background:var(--soft);color:var(--muted)}
  .badge.state-stale{background:var(--attention-soft);color:var(--attention);border:1px dashed var(--attention)}
  .badge.state-done{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .last-activity{margin-left:auto;font-size:11.5px;color:var(--muted);flex:0 0 auto;white-space:nowrap}
  .path{font-size:11.5px;color:var(--muted);margin-top:2px;word-break:break-all}
  .tier1-pct{font-size:12px;font-weight:700;color:var(--accent-ink);margin-top:8px}
  .tier1-active{font-size:12px;color:var(--head);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tier1-impl{font-size:11.5px;color:var(--muted);margin-top:2px}
  /* 이전 작업(결정 GN5, docs/prps/hub-session-revival-and-stale-tier1.md) — 새 색 토큰을
     만들지 않는다(.usage-stale-note 와 같은 관례). */
  .tier1-prev-label{color:var(--attention);font-weight:800}
  .tier1-prev-label::after{content:" · "}
  .card[data-tier1-previous] .tier1-pct{color:var(--muted)}

     아니라 "전환될 대상"이다(결정 Y4) — 라이트에서 moon, 다크에서 sun.

  /* 폭 280→420px · white-space · max-height 세 가지는 세션 발췌 전문 툴팁(.excerpt[data-tooltip])

     두 배를 뺀 값이라 tooltipPosition 의 클램프와 정확히 맞물린다. 넘치는 꼬리는 잘린다 —

  .detail-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .detail-close svg{width:14px;height:14px}

<script>
/* body 파싱 전에 실행돼 첫 페인트부터 확정 테마로 그린다(FOUC 방지).
   저장값이 없으면 시스템 선호를 한 번만 읽어 확정하고 그대로 굳힌다(결정 Y1·Y3) —
   이후로는 OS 테마가 바뀌어도 따라가지 않는다. localStorage 는 file:// 등에서 던질 수 있어 감싼다. */
try{
  var s = localStorage.getItem('dzh-theme');
  var t = (s === 'light' || s === 'dark') ? s
        : ((window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', t);
  if(s !== t) localStorage.setItem('dzh-theme', t);
}catch(e){}
</script>

<script>
(function(){
  // 테마 토글 — 라이트/다크 2상태(결정 Y1~Y4). <head> 인라인 스크립트가 첫 페인트 전에
  // 이미 시스템 선호를 1회 확정해 두므로(FOUC 방지), 여기서는 그 값을 읽고 바꾸기만 한다.
  // 버튼은 #dzh-app 밖의 정적 마크업이라 폴링(불변식 H1″)과 무관하게 이 IIFE 하나로 수명이
  // 끝난다.
  var THEME_STORAGE_KEY = 'dzh-theme';
  var THEME_CYCLE = ['light', 'dark'];
  // 아이콘·라벨은 "지금" 이 아니라 "전환될 대상"을 가리킨다 — 라이트일 때 moon(다크로 전환),
  // 다크일 때 sun(라이트로 전환). 새로고침 버튼의 라벨 규약("동작"을 말한다)과 같다.
  // 아이콘 자체는 CSS 가 고른다(PV10) — 두 SVG 를 마크업에 함께 두고 data-theme 로 스와핑한다.
  var THEME_ACTION_LABEL = {light:'다크 테마로 전환', dark:'라이트 테마로 전환'};
  var toggleButton = document.getElementById('dzh-theme-toggle');
  if(!toggleButton) return;

  // 시스템 선호를 1회 읽는다. matchMedia 가 없는 극단적 환경이면 라이트로 낙착(결정 Y3).
  function resolveSystemTheme(){
    try{
      return (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }catch(e){
      return 'light';
    }
  }

  // 지금 유효한 테마. 저장값이 light/dark 가 아니면(부재·구버전 문자열 등) 시스템 선호로
  // 확정한다 — <head> 스크립트가 이미 저장해 두지만, localStorage 가 막힌 환경에서는
  // 여기서도 방어적으로 다시 판정한다(결정 Y1).
  function currentTheme(){
    try{
      var stored = localStorage.getItem(THEME_STORAGE_KEY);
      return (stored === 'light' || stored === 'dark') ? stored : resolveSystemTheme();
    }catch(e){
      return resolveSystemTheme();
    }
  }

  // data-theme 속성·aria-label·data-tooltip 을 한꺼번에 맞춘다. 아이콘 선택은 CSS 가 한다(PV10).
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    toggleButton.setAttribute('aria-label', THEME_ACTION_LABEL[theme]);
    toggleButton.setAttribute('data-tooltip', THEME_ACTION_LABEL[theme]);
  }

  toggleButton.addEventListener('click', function(){
    var next = THEME_CYCLE[(THEME_CYCLE.indexOf(currentTheme()) + 1) % THEME_CYCLE.length];
    try{ localStorage.setItem(THEME_STORAGE_KEY, next); }
    catch(e){ /* 저장 실패 — 이번 페이지 로드 동안만 토글이 적용된다(결정 Y3) */ }
    applyTheme(next);
  });
  applyTheme(currentTheme());
})();

(function(){
  // 새로고침 회전(PV6~PV8) — 클릭 피드백 전용. 렌더 IIFE 안에 넣지 않는 이유: 그 IIFE 는
  // file:// 모드에서 조기 반환하므로 등록 위치에 따라 회전이 조용히 죽는다. 스냅샷을 모르는
  // 순수 표현이라 테마 토글·툴팁과 같은 층위의 독립 IIFE 가 맞다.
  var REFRESH_SPIN_CLASS = 'refresh-spinning';
  var refreshButton = document.getElementById('dzh-refresh');
  var refreshIconEl = refreshButton && refreshButton.querySelector('svg');
  if(!refreshButton || !refreshIconEl) return;

  refreshButton.addEventListener('click', function(){
    // 제거 → 강제 리플로우 → 재추가. 제거만 하고 곧바로 추가하면 브라우저가 두 변경을 한
    // 프레임에 합쳐 "변화 없음"으로 처리해 연속 클릭에서 재생되지 않는다.
    refreshButton.classList.remove(REFRESH_SPIN_CLASS);
    void refreshButton.offsetWidth;
    refreshButton.classList.add(REFRESH_SPIN_CLASS);
  });
  // 시간을 JS 가 알 필요가 없다 — 애니메이션이 끝났다고 브라우저가 알려준다(PV7).
  refreshIconEl.addEventListener('animationend', function(){
    refreshButton.classList.remove(REFRESH_SPIN_CLASS);
  });
})();

(function(){
  // 전역 커스텀 툴팁 — data-tooltip 트리거 전체가 공유하는 position:fixed 싱글턴(결정 T1).
  // 네이티브 title 은 지연·스타일·위치를 제어할 수 없고 .card{overflow:hidden} 안에서 잘리므로
  // 이 파일 안의 바닐라 CSS/JS 로 대체한다(요구 2). 스냅샷 렌더와 무관한 범용 UI 컴포넌트라
  // 테마 토글과 같은 층위의 독립 IIFE 로 둔다.
  var TOOLTIP_SHOW_DELAY_MS = 120;          // 마우스 hover-intent (결정 T3)
  var TOOLTIP_GAP_PX = 8;                   // 트리거와 툴팁 사이 간격
  var TOOLTIP_VIEWPORT_MARGIN_PX = 8;       // 뷰포트 경계 최소 여백
  var TOOLTIP_VISIBLE_CLASS = 'tooltip-visible';
  var TOOLTIP_ELEMENT_ID = 'dzh-tooltip';
  var TOOLTIP_TRIGGER_SELECTOR = '[data-tooltip]';

  var tooltipEl = document.getElementById(TOOLTIP_ELEMENT_ID);
  if(!tooltipEl) return;
  var currentTrigger = null;                // 표시 중인 트리거(없으면 null)
  var showTimerId = null;

  // 트리거 사각형·툴팁 크기·뷰포트로 {left, top} 을 계산한다. 순수 함수 — DOM 에 닿지 않는다.
  function tooltipPosition(triggerRect, tooltipWidth, tooltipHeight, viewportWidth, viewportHeight){
    var left = triggerRect.left + triggerRect.width / 2 - tooltipWidth / 2;
    left = Math.max(TOOLTIP_VIEWPORT_MARGIN_PX, Math.min(left, viewportWidth - tooltipWidth - TOOLTIP_VIEWPORT_MARGIN_PX));
    var below = triggerRect.bottom + TOOLTIP_GAP_PX;
    var above = triggerRect.top - tooltipHeight - TOOLTIP_GAP_PX;
    var top = (below + tooltipHeight + TOOLTIP_VIEWPORT_MARGIN_PX <= viewportHeight) ? below : above;
    top = Math.max(TOOLTIP_VIEWPORT_MARGIN_PX, Math.min(top, viewportHeight - tooltipHeight - TOOLTIP_VIEWPORT_MARGIN_PX));
    return {left: left, top: top};
  }

  // 트리거의 접근성 이름 근사값. aria-label 이 있으면 그것, 없으면 textContent 를 다듬는다.
  function accessibleNameOf(element){
    var ariaLabel = element.getAttribute('aria-label');
    if(ariaLabel) return ariaLabel.trim();
    return (element.textContent || '').replace(/\s+/g, ' ').trim();
  }

  // 툴팁 문구가 접근성 이름과 다를 때만 true — 같으면 aria-describedby 가 이중 낭독이 된다.
  function shouldDescribe(trigger, text){
    return accessibleNameOf(trigger) !== text;
  }

  // 표시를 끄고 지연 타이머를 취소하고 aria-describedby 를 되돌린다. 언제 불려도 안전하다.
  function hideTooltip(){
    if(showTimerId !== null){ clearTimeout(showTimerId); showTimerId = null; }
    tooltipEl.classList.remove(TOOLTIP_VISIBLE_CLASS);
    if(currentTrigger && currentTrigger.getAttribute('aria-describedby') === TOOLTIP_ELEMENT_ID){
      currentTrigger.removeAttribute('aria-describedby');
    }
    currentTrigger = null;
  }

  // 문구를 채우고 위치를 잡아 표시하고, 필요하면 aria-describedby 를 연결한다(표시 순서 GOTCHA).
  function showTooltip(trigger){
    if(showTimerId !== null){ clearTimeout(showTimerId); showTimerId = null; }
    var text = trigger.getAttribute('data-tooltip') || '';
    tooltipEl.textContent = text;                  // innerHTML 이 아니다 — 문구가 그대로 텍스트가 된다
    tooltipEl.style.left = '0px';
    tooltipEl.style.top = '0px';                    // GOTCHA 3 — 측정 전 좌표 리셋
    var tooltipWidth = tooltipEl.offsetWidth;
    var tooltipHeight = tooltipEl.offsetHeight;
    var position = tooltipPosition(
      trigger.getBoundingClientRect(), tooltipWidth, tooltipHeight,
      window.innerWidth, window.innerHeight
    );
    tooltipEl.style.left = position.left + 'px';
    tooltipEl.style.top = position.top + 'px';
    tooltipEl.classList.add(TOOLTIP_VISIBLE_CLASS);
    currentTrigger = trigger;
    if(shouldDescribe(trigger, text)) trigger.setAttribute('aria-describedby', TOOLTIP_ELEMENT_ID);
  }

  // 표시 요청. 이미 다른 트리거를 보여주는 중이면 지연 없이 즉시 교체한다(결정 T3).
  function requestTooltip(trigger, isImmediate){
    if(trigger === currentTrigger) return;
    if(showTimerId !== null){ clearTimeout(showTimerId); showTimerId = null; }
    if(isImmediate || currentTrigger){ showTooltip(trigger); return; }
    showTimerId = setTimeout(function(){ showTimerId = null; showTooltip(trigger); }, TOOLTIP_SHOW_DELAY_MS);
  }

  // 이벤트 배선 — 전부 document 위임이다(결정 T2). 폴링이 #dzh-app.innerHTML 을 통째로
  // 교체하므로 개별 요소에 리스너를 붙이면 재렌더 후 전부 죽는다.
  document.addEventListener('mouseover', function(event){
    var trigger = event.target.closest(TOOLTIP_TRIGGER_SELECTOR);
    if(trigger){ requestTooltip(trigger, false); return; }
    if(event.target.closest('#' + TOOLTIP_ELEMENT_ID)) return;   // hoverable(WCAG 1.4.13)
    hideTooltip();
  });
  document.addEventListener('mouseleave', function(){ hideTooltip(); });   // 포인터가 창 밖으로 나가면 mouseover 가 더 안 온다
  document.addEventListener('focusin', function(event){
    var trigger = event.target.closest(TOOLTIP_TRIGGER_SELECTOR);
    if(trigger) requestTooltip(trigger, true);   // 포커스 이동은 의도적 행위다 — 지연 0
  });
  document.addEventListener('focusout', function(){ hideTooltip(); });
  document.addEventListener('keydown', function(event){
    if(event.key === 'Escape') hideTooltip();
  });
  document.addEventListener('click', function(){ hideTooltip(); });
  document.addEventListener('scroll', function(){ hideTooltip(); }, {capture: true, passive: true});
  window.addEventListener('resize', function(){ hideTooltip(); });

  // 30초 틱이 트리거 노드를 파괴하는데 포인터가 멈춰 있으면 마우스 이벤트가 안 와 낡은 문구가
  // 남는다(결정 T6) — #dzh-app 의 자식 교체(렌더의 innerHTML 통째 교체)를 감시해 고아 툴팁을
  // 막는다. #dzh-usage-body 관찰은 R5 로 지웠다가(결정 UT4) R-B 가 되살렸다(결정 EX7) —
  // 만료 안내 줄(.usage-stale-note)이 그 안의 유일한 트리거이고, 30초 틱마다 본문이 통째로
  // 교체되므로 이 관찰이 없으면 그 트리거에서도 같은 고아 툴팁이 생긴다.
  var appElForTooltipObserver = document.getElementById('dzh-app');
  var usageBodyElForTooltipObserver = document.getElementById('dzh-usage-body');
  var tooltipDismissObserver = new MutationObserver(function(){ hideTooltip(); });
  if(appElForTooltipObserver) tooltipDismissObserver.observe(appElForTooltipObserver, {childList: true});
  if(usageBodyElForTooltipObserver) tooltipDismissObserver.observe(usageBodyElForTooltipObserver, {childList: true});

  // 표시 중인 트리거의 data-tooltip 이 폴링·틱으로 갱신될 수 있다(#dzh-refresh 의 연결 상태
  // 문구 등) — showTooltip 은 진입 시점에만 속성을 읽으므로, 포인터를 올려둔 채면 다음 진입
  // 전까지 낡은 문구가 남는다. 속성 변경을 감시해 표시 중이면 그 자리에서 다시 그린다.
  var tooltipTextRefreshObserver = new MutationObserver(function(mutations){
    if(!currentTrigger) return;
    for(var i = 0; i < mutations.length; i++){
      if(mutations[i].target === currentTrigger){ showTooltip(currentTrigger); return; }
    }
  });
  tooltipTextRefreshObserver.observe(document.body, {attributes: true, attributeFilter: ['data-tooltip'], subtree: true});
})();

(function(){
  var POLL_INTERVAL_MS = 60000;
  var TICK_MS = 30000;
  var MS_PER_MINUTE = 60000;
  var MINUTES_PER_HOUR = 60;
  var STATE_LABEL = {working:'작업중', idle:'대기', stale:'소식 없음', done:'완료'};
  var STATE_GLYPH = {working:'●', idle:'○', stale:'▲', done:'✓'};
  var MAX_VISIBLE_AGENT_CHIPS = 2;            // 화면에 실을 칩 상한(결정 K1) — 상한 밖 타입은 표시하지 않는다
  // 카드에 실을 발췌 글자 수 상한. 서버가 주는 task_excerpt 는 이보다 길 수 있고(훅의
  // PROMPT_EXCERPT_MAX_CHARS = 500), 넘는 뒷부분은 툴팁이 전문으로 보여준다. 표시 상한을
  // 클라이언트가 갖는 것은 MAX_VISIBLE_AGENT_CHIPS 가 세운 관례다 — 화면 상한은 데이터가
  // 아니라 화면의 몫이다. 120 은 종전 훅 상한과 같은 값이라 카드의 겉모습은 바뀌지 않는다.
  var EXCERPT_DISPLAY_MAX_CHARS = 120;
  var TRUNCATION_MARK = '…';
  // slice 는 UTF-16 코드유닛 단위로 자른다 — 경계에 서로게이트 쌍(이모지)이 반으로 걸리면
  // 반쪼가리가 남아 U+FFFD 로 렌더된다. 마지막으로 남는 유닛이 상위 서로게이트면 한 칸 물린다.
  var HIGH_SURROGATE_PATTERN = /[\uD800-\uDBFF]/;
  var AGENT_RUN_RUNNING_GLYPH = '●';          // 상태 배지의 working 글리프와 의도적으로 같은 모양
  var AGENT_RUN_RUNNING_LABEL = '진행 중';
  var AGENT_RUN_ENDED_LABEL = '종료';
  var AGENT_RUN_NO_PHASE_LABEL = '워크플로우 단계 매핑 없음';
  // "티어 N" 만으로는 의미가 안 드러나 사용자가 두 번 물었다 — 뱃지 텍스트 자체를 설명형으로
  // 바꾼다. data-tooltip 으로 추가 설명을 보완한다(전역 커스텀 툴팁, 결정 T1).
  var TIER_LABEL = {1: '대시보드 추적', 2: '세션 활동', 3: '세션 없음'};
  var TIER_DESCRIPTION = {
    1: '/dashboard 로 진행상황을 기록 중인 프로젝트',
    2: '세션 활동은 있지만 /dashboard 기록은 없는 프로젝트',
    3: '파일시스템에서만 발견됨 — 세션 활동 없음'
  };
  var USAGE_SESSION_LABEL = '세션 (5시간)';
  var USAGE_WEEKLY_LABEL = '주간 (7일)';
  // 퍼센트 출처가 statusLine 캡처로 바뀌면서(결정 P1) "주기" 개념 자체가 없어졌다 — 세션이
  // 돌 때만 실시간으로 갱신되고 안 돌면 정지된다(결정 P6, docs/prps/hub-card-cleanup-and-usage-source.md).
  var USAGE_CYCLE_NOTE = '· 세션 진행 중에만 갱신';
  var USAGE_COLLAPSE_STORAGE_KEY = 'dzh-usage-collapsed';
  var USAGE_COLLAPSED_FLAG = '1';
  var USAGE_CLEARANCE_MARGIN_PX = 32;   // 패널 bottom 오프셋 16 + 여유 16
  var USAGE_RESET_LABEL = '초기화';
  var USAGE_EMPTY_VALUE = '—';         // 만료 시 퍼센트 자리 — 낡은 숫자를 남기지 않는다(결정 EX6)
  var USAGE_STALE_LABEL = '조회되지 않음';
  // 왜(값이 유효하지 않다) + 어떻게(세션 1회) 두 가지만 담는다(결정 EX7) — 패널 안 유일한 툴팁.
  var USAGE_STALE_TOOLTIP = '마지막 확인 이후 5시간이 지나 사용률이 더 이상 유효하지 않습니다. '
    + 'Claude Code 세션을 한 번 시작하면 자동으로 갱신됩니다.';
  var MS_PER_HOUR = 3600000;
  var MS_PER_DAY = 86400000;
  // 12시간 — stale_after_minutes(30분)와 이벤트 표시 창(약 24~48시간) 사이의 임의값이다(결정
  // Z1). 더 나은 앵커가 없음을 인정하고 상수 1개로 둔다 — 되돌리기·값 변경 모두 1줄.
  // MS_PER_HOUR 선언 뒤에 둔다 — var 호이스팅은 선언만 끌어올리고 할당은 올리지 않으므로
  // 앞에 두면 12 * undefined = NaN 이 되어 컷오프가 조용히 죽는다(GOTCHA 2).
  var STALE_SESSION_HIDE_AFTER_MS = 12 * MS_PER_HOUR;
  // 카드 순서 사용자 지정(R2, 결정 O1~O5).
  var PROJECT_ORDER_STORAGE_KEY = 'dzh-project-order';
  var MAX_STORED_PROJECT_ORDER = 200;
  var DRAG_HANDLE_SELECTOR = '.card-drag-handle';
  var DRAG_HANDLE_HINT = '드래그해서 순서 변경';
  // lucide grip-vertical(결정 PV9). 카드마다 반복 삽입되므로 상수 1개로 둔다 — 값은 리터럴이라
  // 매 호출 새 문자열을 만들지 않는다.
  var DRAG_HANDLE_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '
    + 'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" '
    + 'focusable="false"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/>'
    + '<circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/>'
    + '<circle cx="15" cy="19" r="1"/></svg>';
  // 프로젝트 대시보드 모달(R3, 결정 N7) — file:// 모드는 클릭 대상에서 빠지고 사유를 안내한다.
  var FILE_MODE_DASHBOARD_HINT = '허브 서버를 켜면(/hub server start) 카드에서 대시보드를 볼 수 있습니다';

  var app = document.getElementById('dzh-app');
  var refreshButton = document.getElementById('dzh-refresh');
  var usageEl = document.getElementById('dzh-usage');
  var usageToggleButton = document.getElementById('dzh-usage-toggle');
  var usageBodyEl = document.getElementById('dzh-usage-body');
  var usageSummaryEl = document.getElementById('dzh-usage-summary');
  var isUsageCollapsed = readStoredUsageCollapsed();
  var isServed = location.protocol === 'http:' || location.protocol === 'https:';
  var initialDataParse = parseSnapshotJson(document.getElementById('dzh-data').textContent);
  var snapshot = initialDataParse.snapshot;
  var initialParseError = initialDataParse.error;
  var lastHtml = '';
  // 서버(hub_model.build_project_views)는 매 수집마다 last_activity_at_ms 내림차순으로
  // 재정렬한다 — 클라이언트는 그 순서를 그대로 쓰지 않고 사용자가 정한 순서를 기억해 카드
  // 위치를 고정한다(카드가 갱신마다 자리를 옮기면 읽기 흐름이 끊긴다, 결정 O1~O2).
  // 지금 화면에 없는 경로도 남아 있을 수 있다(결정 O3) — 표시 순서는 매 렌더 orderedProjectPaths()
  // 로 따로 계산한다.
  var storedProjectOrder = readStoredProjectOrder();
  var isReordering = false;          // 참이면 render() 가 #dzh-app 을 건드리지 않는다(결정 O6)
  var draggedProjectPath = null;

  // 데이터 블록이 깨지면(수동 편집·render_hub_html 결함 등) JSON.parse 가 던지고, try/catch 가
  // 없으면 이 IIFE 전체가 죽어 render() 가 한 번도 안 불려 "불러오는 중…" 이 영구 고정된다(검수 n4).
  function parseSnapshotJson(rawText){
    try{
      return {snapshot: JSON.parse(rawText || '{}'), error: null};
    }catch(error){
      return {snapshot: {}, error: error};
    }
  }

  // 저장된 카드 순서를 읽는다. 저장소 차단·깨진 값이면 빈 배열(=서버 활동순으로 시작, 결정 O1).
  function readStoredProjectOrder(){
    try{
      var parsed = JSON.parse(localStorage.getItem(PROJECT_ORDER_STORAGE_KEY) || '[]');
      return Array.isArray(parsed) ? parsed.filter(function(path){ return typeof path === 'string'; }) : [];
    }catch(e){
      return [];
    }
  }

  // 카드 순서를 저장한다. 상한(MAX_STORED_PROJECT_ORDER)을 넘으면 뒤에서 잘라낸다(결정 O3).
  // 저장 실패는 흡수한다 — 이번 페이지 로드 동안만 순서가 유효하다(테마·접힘과 동일 처리).
  function persistProjectOrder(order){
    try{
      localStorage.setItem(PROJECT_ORDER_STORAGE_KEY, JSON.stringify(order.slice(0, MAX_STORED_PROJECT_ORDER)));
    }catch(e){ /* 저장 실패 — 이번 로드 동안만 유효 */ }
  }

  // 이번 렌더에 실제로 그릴 카드 순서. 신규(서버 활동순으로 아직 저장 순서에 없는 경로)는
  // 맨 앞에, 그 뒤로 저장 순서 중 지금 화면에 있는 것만 이어붙인다. 순수 함수 — DOM·저장소에
  // 닿지 않는다(결정 O2).
  function orderedProjectPaths(storedOrder, snapshotPaths){
    var known = storedOrder.filter(function(path){ return snapshotPaths.indexOf(path) !== -1; });
    var fresh = snapshotPaths.filter(function(path){ return storedOrder.indexOf(path) === -1; });
    return fresh.concat(known);
  }

  // storedProjectOrder 와 이번 스냅샷으로 "다음에 저장할 전체 순서"를 계산한다 — 화면에 그릴
  // 것(orderedProjectPaths) 뒤에, 지금은 화면에 없지만 저장소에는 남아 있던 경로를 이어붙인다
  // (결정 O3 — 하루 쉰 프로젝트도 자리를 잃지 않는다). 순수 함수.
  function nextStoredProjectOrder(storedOrder, snapshotPaths){
    var displayOrder = orderedProjectPaths(storedOrder, snapshotPaths);
    var hiddenPaths = storedOrder.filter(function(path){ return snapshotPaths.indexOf(path) === -1; });
    return displayOrder.concat(hiddenPaths).slice(0, MAX_STORED_PROJECT_ORDER);
  }

  // 지금 화면에 그려진 카드의 순서를 DOM 에서 직접 읽는다(드래그 라이브 이동·drop 의 기준).
  function currentCardOrder(){
    return Array.prototype.map.call(app.querySelectorAll('.card[data-project-path]'), function(card){
      return card.getAttribute('data-project-path');
    });
  }

  // 새 표시 순서를 저장 순서에 반영·영속화한다. 렌더는 호출자(dragend)가 맡는다 — isReordering
  // 이 걸린 도중에는 render() 가 조기 반환하기 때문이다(결정 O6).
  function commitReorder(newDisplayOrder){
    var snapshotPaths = (snapshot.projects || []).map(function(project){ return project.path; });
    var hiddenPaths = storedProjectOrder.filter(function(path){ return snapshotPaths.indexOf(path) === -1; });
    var nextOrder = newDisplayOrder.concat(hiddenPaths).slice(0, MAX_STORED_PROJECT_ORDER);
    persistProjectOrder(nextOrder);
    storedProjectOrder = nextOrder;
  }

  function elapsedLabel(fromMs){
    var minutes = Math.floor((Date.now() - fromMs) / MS_PER_MINUTE);
    if(!isFinite(minutes) || minutes < 0) return '방금';
    if(minutes < 1) return '방금';
    if(minutes < MINUTES_PER_HOUR) return minutes + '분 전';
    return Math.floor(minutes / MINUTES_PER_HOUR) + '시간 ' + (minutes % MINUTES_PER_HOUR) + '분 전';
  }

  // stale 은 "소식 없음"만으로 부족하다 — 멈추기 전 마지막으로 뭘 하고 있었는지(base_state)를
  // 병기해야 사용자가 "죽었나 아니면 그냥 조용한가"를 가늠할 수 있다(검수 M6 ③).
  function stateLabel(state, baseState){
    if(state === 'stale') return STATE_LABEL.stale + ' · 직전 ' + STATE_LABEL[baseState];
    return STATE_LABEL[state];
  }

  // 색 + 형태(글리프) + 텍스트 3채널 배지(색각 안전 팔레트 보강). baseState 는 선택 인자다 —
  // 세션 배지는 stale 이면 "직전 …"를 병기하고(stateLabel), 프로젝트 배지는 baseState 가 없어
  // STATE_LABEL 을 그대로 쓴다. 여기서 baseState 를 필수로 만들면 stale 프로젝트에서
  // "소식 없음 · 직전 undefined" 가 나온다.
  function renderStateBadge(state, baseState){
    var label = baseState ? stateLabel(state, baseState) : STATE_LABEL[state];
    return '<span class="badge state-' + state + '">'
         + '<span class="glyph" aria-hidden="true">' + STATE_GLYPH[state] + '</span>'
         + label + '</span>';
  }

  // 칩 툴팁 문구. 순수 함수 — DOM 에 닿지 않는다. 예: "구현 단계 · 진행 중"
  function agentRunTooltipText(run){
    var phaseLabel = run.phase ? (run.phase + ' 단계') : AGENT_RUN_NO_PHASE_LABEL;
    var statusLabel = run.is_running ? AGENT_RUN_RUNNING_LABEL : AGENT_RUN_ENDED_LABEL;
    return phaseLabel + ' · ' + statusLabel;
  }

  // 서브에이전트 타입 칩 하나. 실행 중이면 글리프 + 보조기술용 텍스트가 붙는다(GOTCHA 2).
  function renderAgentChip(run){
    var runningClass = run.is_running ? ' agent-chip-running' : '';
    var runningGlyph = run.is_running
      ? '<span class="glyph" aria-hidden="true">' + AGENT_RUN_RUNNING_GLYPH + '</span>' : '';
    var runningSrText = run.is_running
      ? '<span class="sr-only"> ' + AGENT_RUN_RUNNING_LABEL + '</span>' : '';
    return '<span class="agent-chip' + runningClass + '" data-tooltip="'
      + escapeHtml(agentRunTooltipText(run)) + '">'
      + runningGlyph + escapeHtml(run.agent_type) + runningSrText + '</span>';
  }

  // 화면에 실을 칩 목록의 유일한 판정자(결정 K1). renderAgentRuns 와 shouldRenderSession 이
  // 이 함수를 공유한다 — shouldRenderSession 이 agent_runs.length 를 직접 보면 "칩은 없는데
  // 줄은 남는" 어긋남이 생긴다(GOTCHA 3).
  function visibleAgentRuns(runs){
    if(!runs) return [];
    return runs.slice(0, MAX_VISIBLE_AGENT_CHIPS);
  }

  // 칩 목록. 상한을 넘는 타입은 표시하지 않는다 — "+N" 오버플로 칩은 결정 K3 로 폐기됐다.
  // summarize_agent_runs(서버)가 실행 중 타입을 항상 먼저 주므로(결정 K2) 상한 안에서도
  // 지금 진행 중인 작업은 계속 보인다.
  function renderAgentRuns(runs){
    var visibleRuns = visibleAgentRuns(runs);
    if(!visibleRuns.length) return '';
    return '<span class="agent-runs">' + visibleRuns.map(renderAgentChip).join('') + '</span>';
  }

  // 카드에 보일 발췌 문구. 순수 함수 — 상한을 넘으면 말줄임표를 붙여 자른다.
  function excerptDisplayText(fullText){
    if(fullText.length <= EXCERPT_DISPLAY_MAX_CHARS) return fullText;
    var cutLength = EXCERPT_DISPLAY_MAX_CHARS;
    if(HIGH_SURROGATE_PATTERN.test(fullText.charAt(cutLength - 1))) cutLength -= 1;
    return fullText.slice(0, cutLength) + TRUNCATION_MARK;
  }

  // 발췌 1줄. 카드 높이가 고정(340px)이라 긴 프롬프트를 화면에서 다 흘릴 수 없다 — 잘린
  // 뒷부분은 hover 툴팁이 맡는다. data-tooltip 은 실제로 잘렸을 때만 붙인다: 보이는 텍스트와
  // 같은 툴팁은 정보 손실이 없어 소음이며, 카드 이름에서 이미 같은 판단을 했다(결정 R4).
  // 툴팁이 보여주는 것도 "전문"이 아니라 훅이 기록한 상한까지다 — 그 상한에서 잘렸다는 사실은
  // 훅이 붙인 말줄임표(PROMPT_TRUNCATION_MARK)가 문구 끝에 그대로 실려 온다.
  function renderSessionExcerpt(fullText){
    if(!fullText) return '';
    var displayText = excerptDisplayText(fullText);
    var tooltipAttribute = displayText === fullText
      ? '' : ' data-tooltip="' + escapeHtml(fullText) + '"';
    return '<span class="excerpt"' + tooltipAttribute + '>' + escapeHtml(displayText) + '</span>';
  }

  function renderSession(session){
    return '<li><div class="session-line">'
      + renderStateBadge(session.state, session.base_state)
      + '<span class="session-time">' + elapsedLabel(session.last_event_at_ms) + '</span>'
      + renderAgentRuns(session.agent_runs)
      + '</div>' + renderSessionExcerpt(session.task_excerpt) + '</li>';
  }

  // 숨김 조건 = 완료 + 표시할 발췌 없음 + 보이는 칩 0개(결정 V2). visibleAgentRuns 를 반드시
  // 경유한다(GOTCHA 3) — agent_runs.length 를 직접 보면 상한 밖으로 밀린 종료 타입 때문에
  // 칩이 없는데도 줄이 남는 어긋남이 생긴다. stale 세션은 마지막 이벤트로부터
  // STALE_SESSION_HIDE_AFTER_MS(결정 Z1) 넘게 조용하면 함께 숨긴다. 둘 다 클라이언트 전용
  // 필터라 프로젝트 배지 집계(서버의 state)에는 영향을 주지 않는다(결정 V1).
  function shouldRenderSession(session){
    var hasVisibleChip = visibleAgentRuns(session.agent_runs).length > 0;
    if(session.state === 'done' && !session.task_excerpt && !hasVisibleChip) return false;
    if(session.state === 'stale' && (Date.now() - session.last_event_at_ms) >= STALE_SESSION_HIDE_AFTER_MS){
      return false;
    }
    return true;
  }

  function renderTier1ActiveStep(tier1){
    var steps = tier1.steps || [];
    var activeStep;
    for(var i = 0; i < steps.length; i++){
      if(steps[i].state === 'active'){ activeStep = steps[i]; break; }
    }
    if(!activeStep) return '';
    var detail = activeStep.detail ? ' — ' + escapeHtml(activeStep.detail) : '';
    return '<div class="tier1-active">' + escapeHtml(activeStep.name) + detail + '</div>';
  }

  function renderTier1ImplProgress(tier1){
    if(!tier1.impl_total) return '';
    return '<div class="tier1-impl">구현 세부 ' + tier1.impl_done + '/' + tier1.impl_total + '</div>';
  }

  // isPreviousTask(결정 GN5) — true 면 제목 앞에 "이전 작업 · " 라벨을 붙인다. 톤 다운은
  // .card[data-tier1-previous] 스코프 CSS 가 renderProject 의 카드 속성을 보고 담당한다.
  function renderTier1(tier1, isPreviousTask){
    if(!tier1) return '';
    var prevLabel = isPreviousTask ? '<span class="tier1-prev-label">이전 작업</span>' : '';
    return '<div class="tier1-pct">' + prevLabel + escapeHtml(tier1.title) + ' — '
      + tier1.completed + '/' + tier1.total + ' · ' + tier1.percent + '%</div>'
      + renderTier1ActiveStep(tier1) + renderTier1ImplProgress(tier1);
  }

  // 드래그 전용 핸들(결정 DG1~DG3). 키보드로 아무 것도 할 수 없게 됐으므로 <button> 이 아니다 —
  // 포커스는 받지만 Enter/Space 에 반응하지 않는 컨트롤은 보조기술 사용자에게 거짓말이 된다.
  // aria-hidden 으로 접근성 트리에서 빼고, Tab 순서에서도 자연히 빠진다(span 은 기본 비포커스).
  function renderDragHandle(){
    return '<span class="card-drag-handle" draggable="true" aria-hidden="true" data-tooltip="'
      + escapeHtml(DRAG_HANDLE_HINT) + '">' + DRAG_HANDLE_ICON_SVG + '</span>';
  }

  // 클릭 가능(티어 1 + 서버 모드)이면 <button>, 아니면 <span> — 없는 기능을 있는 척하지
  // 않는다(결정 N6). data-tooltip 은 R4 로 제거됐다: 보이는 텍스트와 같아 정보 손실이 없다.
  function renderProjectNameEl(project, isClickable){
    var tag = isClickable ? 'button' : 'span';
    var typeAttr = isClickable ? ' type="button"' : '';
    return '<' + tag + ' class="project-name"' + typeAttr + '>' + escapeHtml(project.display_name) + '</' + tag + '>';
  }

  function renderProject(project){
    // 세션은 서버가 오래된 것부터 준다(§2.4-2, hub_project.compose_project_views) — 클라이언트가
    // 최신순으로 다시 정렬한다(결정 Z1 안 2). slice() 로 복제해 원본 project.sessions 를
    // 변형하지 않는다 — 같은 snapshot 객체가 다음 TICK_MS 렌더에도 재사용된다.
    var visibleSessions = project.sessions
      .slice()
      .sort(function(a, b){ return b.last_event_at_ms - a.last_event_at_ms; })
      .filter(shouldRenderSession);
    var sessionsHtml = visibleSessions.length
      ? '<ul class="sessions">' + visibleSessions.map(renderSession).join('') + '</ul>' : '';
    // 클릭 가능 ⇔ dashboard_key 존재 + 서버 모드(결정 N2·N7). file:// 에서는 안내 툴팁만 준다.
    var isClickable = Boolean(project.dashboard_key) && isServed;
    var cardAttrs = ' data-project-path="' + escapeHtml(project.path || '') + '"';
    if(isClickable) cardAttrs += ' data-dashboard-key="' + escapeHtml(project.dashboard_key) + '"';
    else if(project.dashboard_key) cardAttrs += ' data-tooltip="' + escapeHtml(FILE_MODE_DASHBOARD_HINT) + '"';
    // 속성 하나가 CSS 스코프와 패널 인계를 겸한다(결정 GN4 — data-dashboard-key 와 같은 관례).
    if(project.tier1_is_previous_task) cardAttrs += ' data-tier1-previous="1"';
    // working 만 강조한다 — stale 은 base_state 가 working 이어도 "소식 없음"이므로 강조하면
    // 지금 돌고 있다고 오해하게 된다(R3, 결정 D2).
    var stateClass = project.state === 'working' ? ' card-working' : '';
    return '<div class="card' + stateClass + '"' + cardAttrs + '>'
      + '<div class="project-head">'
      + renderDragHandle()
      + renderProjectNameEl(project, isClickable)
      + '<span class="badge tier" data-tooltip="' + escapeHtml(TIER_DESCRIPTION[project.tier] || '') + '">' + escapeHtml(TIER_LABEL[project.tier] || ('티어 ' + project.tier)) + '</span>'
      + renderStateBadge(project.state)
      + '<span class="last-activity">' + elapsedLabel(project.last_activity_at_ms) + '</span>'
      + '</div>'
      + (project.path ? '<div class="path">' + escapeHtml(project.path) + '</div>' : '')
      + renderTier1(project.tier1, project.tier1_is_previous_task) + sessionsHtml + '</div>';
  }

  // 따옴표도 이스케이프한다 — usage-meta 의 data-tooltip="..." 이 이 함수의 첫 속성 자리
  // 사용처다(검수 m3). 텍스트 자리에서는 무해하고, 속성 자리로 재사용될 다음 호출부를 미리
  // 방어한다.
  function escapeHtml(text){
    return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // 상주 서버(개정 쟁점 R3)는 내용이 바뀌지 않으면 hub.html 을 다시 쓰지 않는다 — 그래서
  // collected_at_ms 는 "수집 시각"이 아니라 "마지막 변화 시각"이다. 폴링 성공/실패 자체가
  // 서버 생존의 증거이므로, 그 상태를 별도로 표시해야 "멈춘 것"과 "변화가 없는 것"을 구별할 수
  // 있다(초판 리스크 8 의 재발 방지).
  var POLL_FAILURE_THRESHOLD = 2;
  var consecutiveFailureCount = 0;
  var lastPollSuccessAtMs = null;
  var connectionLost = false;

  function formatTimestamp(epochMs){
    return new Date(epochMs).toLocaleString('ko-KR');
  }

  // #dzh-data 는 신뢰 가능한 서버 생성물이지만 템플릿의 관행대로 방어한다 — Number() 강제
  // 변환 후 isFinite 가 아니면 막대를 그리지 않고, 표시 폭은 0~100 으로 클램프한다(레이아웃
  // 붕괴·스타일 속성 주입 방지). 표시 숫자(rawValue)는 클램프하지 않은 원값을 쓴다.
  function clampPercent(value){
    var number = Number(value);
    if(!isFinite(number)) return null;
    return Math.max(0, Math.min(100, number));
  }

  function renderUsageBar(label, rawValue){
    var clamped = clampPercent(rawValue);
    if(clamped === null) return '';
    return '<div class="usage-row"><span>' + label + '</span><span class="usage-pct">' + rawValue + '%</span></div>'
      + '<div class="usage-bar" role="progressbar" aria-valuenow="' + clamped + '" aria-valuemin="0" aria-valuemax="100" aria-label="' + label + ' 사용률"><span style="width:' + clamped + '%"></span></div>';
  }

  // 남은 시간을 사람이 읽는 문자열로. 이미 지났으면(diffMs<=0) null — 호출자가 줄을 그리지
  // 않는다(결정 R5 의 클라이언트 쪽 2차 필터가 바로 이 판정이다).
  function remainingLabel(untilMs, nowMs){
    var diffMs = untilMs - nowMs;
    if(!isFinite(diffMs) || diffMs <= 0) return null;
    if(diffMs < MS_PER_MINUTE) return '곧';
    if(diffMs < MS_PER_HOUR) return Math.floor(diffMs / MS_PER_MINUTE) + '분 뒤';
    if(diffMs < MS_PER_DAY){
      var hours = Math.floor(diffMs / MS_PER_HOUR);
      var minutes = Math.floor((diffMs % MS_PER_HOUR) / MS_PER_MINUTE);
      return hours + '시간 ' + minutes + '분 뒤';
    }
    return Math.floor(diffMs / MS_PER_DAY) + '일 뒤';
  }

  // '초기화 18:32 · 2시간 12분 뒤'. 값이 없거나 이미 지났으면 null. 순수 — DOM 에 닿지 않는다.
  function usageResetText(resetsAtMs, nowMs){
    if(resetsAtMs === null || resetsAtMs === undefined) return null;
    var value = Number(resetsAtMs);
    if(!isFinite(value)) return null;
    var remaining = remainingLabel(value, nowMs);
    if(remaining === null) return null;
    var resetDate = new Date(value);
    var nowDate = new Date(nowMs);
    var sameDay = resetDate.getFullYear() === nowDate.getFullYear()
      && resetDate.getMonth() === nowDate.getMonth()
      && resetDate.getDate() === nowDate.getDate();
    var pad2 = function(n){ return (n < 10 ? '0' : '') + n; };
    var timePart = pad2(resetDate.getHours()) + ':' + pad2(resetDate.getMinutes());
    var absolutePart = sameDay ? timePart : (resetDate.getMonth() + 1) + '/' + resetDate.getDate() + ' ' + timePart;
    return USAGE_RESET_LABEL + ' ' + absolutePart + ' · ' + remaining;
  }

  // 초기화 예정 시각 한 줄의 HTML. 그릴 값이 없으면 빈 문자열.
  // 툴팁은 R5 로 제거됐다 — 패널 안에서는 마우스를 올려도 아무 말도 걸지 않는다(결정 UT1).
  // 캡처 시각은 /hub status 의 rate_limit_capture_age_ms 로 진단한다.
  function renderUsageResetRow(resetsAtMs){
    var text = usageResetText(resetsAtMs, Date.now());
    if(text === null) return '';
    return '<div class="usage-reset">' + escapeHtml(text) + '</div>';
  }

  function hideUsagePanel(){
    usageEl.hidden = true;
    document.body.classList.remove('has-usage');
  }

  // 저장된 접힘 상태를 읽는다. 저장소 접근이 막힌 환경(file:// 등)에서는 펼침으로 본다(결정 C3).
  function readStoredUsageCollapsed(){
    try{
      return localStorage.getItem(USAGE_COLLAPSE_STORAGE_KEY) === USAGE_COLLAPSED_FLAG;
    }catch(e){
      return false;
    }
  }

  // 접힘이면 플래그를 쓰고 펼침이면 키를 지운다(결정 C2). 저장 실패는 무시한다 — 이번
  // 페이지 로드 동안만 토글이 유효하다(결정 C3, 테마 토글과 동일 처리).
  function persistUsageCollapsed(collapsed){
    try{
      if(collapsed) localStorage.setItem(USAGE_COLLAPSE_STORAGE_KEY, USAGE_COLLAPSED_FLAG);
      else localStorage.removeItem(USAGE_COLLAPSE_STORAGE_KEY);
    }catch(e){ /* 저장 실패 — 이번 로드 동안만 유효(결정 C3) */ }
  }

  // 접힘 상태에 보일 한 줄 요약 문자열. 순수 함수 — DOM 에 닿지 않는다(결정 C5).
  function usageSummaryText(usage){
    if(usage.is_stale) return USAGE_STALE_LABEL;
    return '세션 ' + usage.session_percent + '% · 주간 ' + usage.weekly_percent + '%';
  }

  // 패널 실측 높이로 본문 하단 여백(--usage-clearance)을 맞춘다(결정 L3). hidden 상태에서는
  // offsetHeight 가 0 이므로 반드시 내용 채우기 → hidden=false 이후에 호출해야 한다(GOTCHA 4).
  function applyUsageClearance(){
    document.body.style.setProperty('--usage-clearance', (usageEl.offsetHeight + USAGE_CLEARANCE_MARGIN_PX) + 'px');
  }

  // 접힘 상태를 클래스·aria-expanded·하단 여백에 반영한다. 재렌더 후 복원 경로다(불변식 H1′).
  function applyUsageCollapsedState(){
    usageEl.classList.toggle('usage-collapsed', isUsageCollapsed);
    usageToggleButton.setAttribute('aria-expanded', isUsageCollapsed ? 'false' : 'true');
    applyUsageClearance();
  }

  // 만료 행 — 막대를 그리지 않는다. 0% 로 오해되는 빈 막대보다 '값 없음'이 정직하다(결정 EX6).
  function renderUsageStaleRow(label){
    return '<div class="usage-row"><span>' + label + '</span>'
      + '<span class="usage-pct usage-pct-empty">' + USAGE_EMPTY_VALUE + '</span></div>';
  }

  // 만료 안내 한 줄. 패널 안 유일한 툴팁 트리거다(결정 EX7) — 그래서 tooltipDismissObserver 의
  // #dzh-usage-body 관찰이 함께 되살아났다(불변식 H1‴ 조항 5 의 조건).
  function renderUsageStaleNote(usage){
    return '<div class="usage-meta usage-stale-note" data-tooltip="' + escapeHtml(USAGE_STALE_TOOLTIP)
      + '">' + USAGE_STALE_LABEL + ' · 마지막 갱신 ' + elapsedLabel(usage.sampled_at_ms) + '</div>';
  }

  // 패널을 실제로 띄우는 유일한 경로 — 신선/만료 두 분기가 표시 상태 갱신을 공유한다.
  function showUsagePanel(bodyHtml, summaryText, isStale){
    usageSummaryEl.textContent = summaryText;
    usageBodyEl.innerHTML = bodyHtml;
    usageEl.classList.toggle('usage-stale', isStale);
    usageEl.hidden = false;
    document.body.classList.add('has-usage');
    applyUsageCollapsedState();
  }

  // 컨테이너(#dzh-usage)와 토글 버튼(#dzh-usage-toggle)은 정적, 내용(#dzh-usage-body ·
  // #dzh-usage-summary)만 파생이다(불변식 H1′, 결정 C1). usage 가 없으면(스위치 off·파일
  // 없음·계약 불일치, 결정 U3·U4) 조용히 숨긴다 — 경고를 띄우지 않는다. 만료·롤오버는 숨기지
  // 않고 usage.is_stale 분기로 그린다(R-B, 결정 EX1·EX2). resets 는 장식이다(결정 R3) —
  // 없어도 usage 만 있으면 패널은 그려진다.
  function renderUsagePanel(usage, resets){
    if(!usage){ hideUsagePanel(); return; }
    var sessionResetRow = renderUsageResetRow(resets && resets.session_resets_at_ms);
    var weeklyResetRow = renderUsageResetRow(resets && resets.weekly_resets_at_ms);
    if(usage.is_stale){
      showUsagePanel(
        renderUsageStaleRow(USAGE_SESSION_LABEL) + sessionResetRow
        + renderUsageStaleRow(USAGE_WEEKLY_LABEL) + weeklyResetRow
        + renderUsageStaleNote(usage),
        usageSummaryText(usage), true
      );
      return;
    }
    var sessionBar = renderUsageBar(USAGE_SESSION_LABEL, usage.session_percent);
    var weeklyBar = renderUsageBar(USAGE_WEEKLY_LABEL, usage.weekly_percent);
    if(!sessionBar || !weeklyBar){ hideUsagePanel(); return; }
    var meta = '마지막 갱신 ' + elapsedLabel(usage.sampled_at_ms) + ' ' + USAGE_CYCLE_NOTE;
    showUsagePanel(
      sessionBar + sessionResetRow + weeklyBar + weeklyResetRow
      + '<div class="usage-meta">' + meta + '</div>',
      usageSummaryText(usage), false
    );
  }

  // 연결 상태 문구는 별도 span 이 아니라 새로고침 버튼의 data-tooltip 으로 제공한다 —
  // 좁은 화면에서 헤더 우측 텍스트가 고정 버튼과 겹치던 문제의 해소책이다. aria-label
  // ("새로고침")과 문구가 달라 전역 툴팁이 aria-describedby 를 붙여 준다(이중 낭독 없음).
  function renderConnectionStatus(){
    if(initialParseError) return;
    var lastChange = formatTimestamp(snapshot.collected_at_ms);
    var statusText;
    if(!isServed){
      statusText = '마지막 변화: ' + lastChange + ' · 허브 서버 꺼짐';
    } else if(connectionLost){
      statusText = '서버 연결 끊김 — 화면이 ' + lastChange + ' 에 멈췄습니다';
    } else {
      var secondsSincePoll = lastPollSuccessAtMs ? Math.floor((Date.now() - lastPollSuccessAtMs) / 1000) : 0;
      statusText = '마지막 변화: ' + lastChange + ' · 서버 연결됨 (' + secondsSincePoll + '초 전 확인)';
    }
    refreshButton.setAttribute('data-tooltip', statusText);
    refreshButton.classList.toggle('connection-lost', isServed && connectionLost);
  }

  // 이번 스냅샷으로 저장 순서를 갱신·영속화(필요할 때만)하고 화면에 그릴 순서를 돌려준다.
  // 계산된 전체 순서가 저장된 것과 다를 때만 쓴다(결정 O4) — 정상 상태에서는 첫 렌더 1회만
  // 쓰고 그 뒤로는 0회다(신규 프로젝트가 없는 한).
  function syncProjectOrder(snapshotPaths){
    var displayOrder = orderedProjectPaths(storedProjectOrder, snapshotPaths);
    var nextOrder = nextStoredProjectOrder(storedProjectOrder, snapshotPaths);
    if(JSON.stringify(nextOrder) !== JSON.stringify(storedProjectOrder)) persistProjectOrder(nextOrder);
    storedProjectOrder = nextOrder;
    return displayOrder;
  }

  function render(){
    if(isReordering) return;    // 드래그 중에는 다시 그리지 않는다(결정 O6, 불변식 H1″)
    if(initialParseError){
      app.innerHTML = '<div class="empty">데이터를 읽지 못했습니다 ('
        + escapeHtml(String(initialParseError.message || initialParseError))
        + '). 페이지를 새로고침해 보세요.</div>';
      return;
    }
    var projects = snapshot.projects || [];
    if(!projects.length){
      app.innerHTML = '<div class="empty">아직 프로젝트가 없습니다. 훅을 설치했나요? — /hub install</div>';
    } else {
      var displayOrder = syncProjectOrder(projects.map(function(project){ return project.path; }));
      var projectsByPath = {};
      for(var i = 0; i < projects.length; i++) projectsByPath[projects[i].path] = projects[i];
      app.innerHTML = displayOrder.map(function(path){ return renderProject(projectsByPath[path]); }).join('');
    }
    var extra = '';
    if(snapshot.warnings && snapshot.warnings.length){
      extra += '<div class="warnings">' + snapshot.warnings.map(escapeHtml).join('<br>') + '</div>';
    }
    app.insertAdjacentHTML('beforeend', extra);
    renderConnectionStatus();
    renderUsagePanel(snapshot.usage, snapshot.rate_limit_resets);
  }
  // 펼치는 순간 다음 폴링(최대 5초)을 기다리지 않고 그 자리에서 한 번 더 갱신한다(요구 2).
  // ①은 file:// 모드에서도 동작하는 로컬 재계산, ②는 서버 모드에서만 가능한 즉시 fetch 다.
  // 이 리스너는 반드시 아래 `if(!isServed){ … return; }` 앞에 등록돼야 한다 — 뒤로 옮기면
  // file:// 모드에서 접기 기능 자체가 사라진다(GOTCHA 4). `poll` 을 여기서 참조할 수 있는
  // 것은 `function poll(){}` 이 호이스팅되는 함수 선언이기 때문이다.
  usageToggleButton.addEventListener('click', function(){
    isUsageCollapsed = !isUsageCollapsed;
    persistUsageCollapsed(isUsageCollapsed);
    applyUsageCollapsedState();
    if(isUsageCollapsed) return;
    renderUsagePanel(snapshot.usage, snapshot.rate_limit_resets);  // ① 라벨을 지금 시각으로 다시 계산
    if(isServed) poll();                                           // ② 서버에 최신 스냅샷을 즉시 요청
  });

  // 패널 바깥 클릭으로 접는다(R4, 결정 Q1~Q5). 위 토글과 마찬가지로 이 리스너도 반드시
  // `if(!isServed){ … return; }` 앞에 등록돼야 한다 — 뒤로 가면 file:// 모드에서 기능이
  // 통째로 사라진다(GOTCHA 2).
  document.addEventListener('click', function(event){
    if(isUsageCollapsed) return;                       // 이미 접혀 있으면 할 일이 없다
    if(usageEl.hidden) return;                         // 패널이 없는 화면에서 접힘을 저장하지 않는다(결정 Q3)
    if(event.target.closest('#dzh-usage')) return;     // 패널 안(토글 버튼 포함)은 토글 리스너 소관(GOTCHA 1)
    if(event.target.closest('#dzh-detail-panel')) return;   // 상세 패널 클릭은 페이지 클릭이 아니다(결정 Q4 승계)
    isUsageCollapsed = true;
    persistUsageCollapsed(isUsageCollapsed);
    applyUsageCollapsedState();
  });

  // 카드 순서 변경(R7, 결정 DG1~DG6) — #dzh-app 자식은 렌더마다 전멸하므로 전부 document
  // 위임이다(결정 O7). HTML5 DnD: dragstart(핸들에서 시작, 카드 전체를 고스트로 삼는다) →
  // dragover(대상 카드 위치로 드래그 중인 카드를 실제로 옮긴다 — 라이브 이동. preventDefault
  // 필수, GOTCHA 3) → drop(그 시점의 DOM 순서를 그대로 커밋한다 — 인덱스 산술 없음) →
  // dragend(모든 경로 — 성공·취소·Escape — 에서 반드시 발화하므로 여기서 isReordering 을
  // 해제하고 한 번만 다시 그려 취소된 이동을 되돌린다). 조작 수단은 드래그 하나뿐이다 —
  // 키보드 이동은 사용자 요구로 제거됐다(WCAG 2.1.1 회귀, 결정 DG2 에 기록).
  document.addEventListener('dragstart', function(event){
    var handle = event.target.closest(DRAG_HANDLE_SELECTOR);
    var card = handle && handle.closest('[data-project-path]');
    if(!card) return;
    draggedProjectPath = card.getAttribute('data-project-path');
    isReordering = true;
    card.classList.add('card-dragging');
    var cardRect = card.getBoundingClientRect();
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', draggedProjectPath);   // Firefox 는 이게 없으면 드래그를 시작하지 않는다
    // 핸들이 카드 왼쪽 위에 있어 오프셋이 작다 — 고스트가 커서에 자연스럽게 매달린다(결정 DG7).
    event.dataTransfer.setDragImage(card, event.clientX - cardRect.left, event.clientY - cardRect.top);
  });
  document.addEventListener('dragover', function(event){
    if(draggedProjectPath === null) return;
    var targetCard = event.target.closest('[data-project-path]');
    if(!targetCard) return;
    event.preventDefault();                        // GOTCHA 3 — 없으면 drop 이 아예 안 온다
    var draggedCard = app.querySelector('.card-dragging');
    if(!draggedCard || targetCard === draggedCard) return;
    // 대상이 드래그 중인 카드보다 뒤에 있으면(=내가 앞) 대상 '뒤'로, 아니면 대상 '앞'으로
    // 넣는다 — 인덱스 산술로 순서를 옮기던 옛 방식과 결과가 정확히 같다(결정 DG4).
    // 좌표(중심점) 비교는 쓰지 않는다 — 3열 그리드에서는 좌우·상하가 섞여 새 임계값이 생긴다.
    // 카드 높이가 균일(340px)하므로 이동 직후 포인터 아래 슬롯에는 드래그 중인 카드 자신이
    // 놓여 다음 dragover 가 즉시 반환한다 — 진동(oscillation)이 생기지 않는 근거다(GOTCHA 17).
    var draggedIsBefore = !!(draggedCard.compareDocumentPosition(targetCard)
                             & Node.DOCUMENT_POSITION_FOLLOWING);
    app.insertBefore(draggedCard, draggedIsBefore ? targetCard.nextSibling : targetCard);
  });
  document.addEventListener('drop', function(event){
    if(draggedProjectPath === null) return;
    if(!event.target.closest('[data-project-path]')) return;
    event.preventDefault();
    commitReorder(currentCardOrder());            // DOM 이 곧 최종 순서다(결정 DG4·DG5)
  });
  document.addEventListener('dragend', function(){
    draggedProjectPath = null;
    isReordering = false;
    render();     // 드래그 중 억눌렸던 재렌더를 여기서 한 번 따라잡는다(취소 시 라이브 이동도 되돌린다)
  });

  render();
  setInterval(render, TICK_MS);

  if(!isServed){
    var reloading = false;
    var reloadOnce = function(){ if(reloading) return; reloading = true; location.reload(); };
    document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') reloadOnce(); });
    window.addEventListener('focus', reloadOnce);
    refreshButton.addEventListener('click', reloadOnce);
    return;
  }

  var busy = false;
  function poll(){
    if(busy) return;
    busy = true;
    fetch(location.pathname, {cache:'no-store'})
      .then(function(res){ if(!res.ok) throw new Error(res.status); return res.text(); })
      .then(function(html){
        consecutiveFailureCount = 0;
        connectionLost = false;
        lastPollSuccessAtMs = Date.now();
        if(html === lastHtml){ renderConnectionStatus(); return; }
        lastHtml = html;
        var fresh = new DOMParser().parseFromString(html, 'text/html');
        var freshData = fresh.getElementById('dzh-data');
        if(freshData){ snapshot = JSON.parse(freshData.textContent || '{}'); }
        render();
      })
      .catch(function(){
        consecutiveFailureCount++;
        if(consecutiveFailureCount >= POLL_FAILURE_THRESHOLD) connectionLost = true;
        renderConnectionStatus();
      })
      .then(function(){ busy = false; });
  }
  setInterval(poll, POLL_INTERVAL_MS);
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') poll(); });
  window.addEventListener('focus', poll);
  refreshButton.addEventListener('click', poll);
})();

(function(){
  // 프로젝트 상세 패널(SP1~SP9) — 카드를 누르면 그 프로젝트의 dashboard.html 을 우측 패널의
  // iframe 으로 띄운다. <aside> 는 #dzh-app 바깥의 정적 마크업이라 폴링·틱과 무관하다
  // (불변식 H1⁗). 카드가 data-dashboard-key 를 가졌는지만으로 클릭 가능 여부가 정해지므로
  // (결정 N2·N7) 이 IIFE 는 snapshot 을 몰라도 된다 — 렌더 IIFE 와 완전히 분리돼 있다.
  var PANEL_OPEN_BODY_CLASS = 'dzh-panel-open';
  var PANEL_PUSH_MIN_WIDTH_PX = 1024;      // CSS 의 @media (min-width:1024px) 와 같은 값(GOTCHA 2)
  var PANEL_CLOSE_ANIMATION_MS = 180;      // CSS 의 transition 시간과 같은 값(T25-84)
  var PROJECT_DASHBOARD_PATH_PREFIX = '/project/';
  var PROJECT_DASHBOARD_PATH_SUFFIX = '/dashboard.html';
  var BLANK_DOCUMENT_URL = 'about:blank';
  var DASHBOARD_KEY_ATTRIBUTE = 'data-dashboard-key';
  var CLICKABLE_CARD_SELECTOR = '[' + DASHBOARD_KEY_ATTRIBUTE + ']';
  // 이전 작업 안내 줄(결정 GN6) — 카드의 data-tier1-previous 속성이 유일한 출처다. 이 IIFE 는
  // 렌더 IIFE 가 쥔 스냅샷 데이터를 여전히 몰라도 된다(T25-89 가 기계적으로 강제한다).
  var TIER1_PREVIOUS_TASK_ATTRIBUTE = 'data-tier1-previous';
  var DETAIL_NOTE_VISIBLE_CLASS = 'detail-note-visible';

  var panelEl = document.getElementById('dzh-detail-panel');
  var panelTitleEl = document.getElementById('dzh-detail-title');
  var panelNoteEl = document.getElementById('dzh-detail-note');
  var panelFrameEl = document.getElementById('dzh-detail-frame');
  var panelCloseButton = document.getElementById('dzh-detail-close');
  var mainEl = document.querySelector('.wrap');
  var usageEl = document.getElementById('dzh-usage');
  if(!panelEl || !panelTitleEl || !panelNoteEl || !panelFrameEl || !panelCloseButton || !mainEl) return;

  var pushModeQuery = matchMedia('(min-width:' + PANEL_PUSH_MIN_WIDTH_PX + 'px)');
  var openDashboardKey = null;      // 열림 상태의 유일한 진실. body 클래스는 이 값의 투영이다
  var panelOpenerElement = null;    // 닫을 때 포커스를 되돌릴 요소
  var panelBlankTimerId = null;     // 닫기 슬라이드가 끝난 뒤 iframe 을 비울 예약(SP14)

  // 대시보드 키로 서버 경로를 만든다. 순수 함수.
  function projectDashboardUrl(dashboardKey){
    return PROJECT_DASHBOARD_PATH_PREFIX + dashboardKey + PROJECT_DASHBOARD_PATH_SUFFIX;
  }

  // 패널 iframe 을 그 문서로 교체 이동시킨다(SP9) — src 대입은 부모 문서의 히스토리에 항목을
  // 남겨, 카드를 옮겨 다닐수록 사용자의 뒤로가기가 허브가 아니라 iframe 을 되감게 된다.
  function loadPanelDocument(url){
    panelFrameEl.contentWindow.location.replace(url);
  }

  // 슬라이드가 끝난 뒤에 iframe 을 비운다(리스크 R-6) — 나가는 도중에 비우면 빠져나가는 패널이
  // 흰 화면으로 번쩍인다. transitionend 를 쓰지 않는 이유는 GOTCHA 12: 저감 모드에서는 발화하지
  // 않고 백그라운드 탭에서는 상한 없이 밀린다.
  function scheduleBlankAfterSlide(){
    panelBlankTimerId = setTimeout(function(){
      panelBlankTimerId = null;
      loadPanelDocument(BLANK_DOCUMENT_URL);
    }, PANEL_CLOSE_ANIMATION_MS);
  }

  // 오버레이 모드로 열려 있을 때만 배경을 조작 불가로 만든다(SP3). 포커스 트랩 코드를 쓰지
  // 않는 이유이자, aria-modal 을 상시로 붙이지 않는 이유다 — 실제로 막았을 때만 그렇게 말한다.
  function applyBackgroundInert(){
    var isOverlayOpen = openDashboardKey !== null && !pushModeQuery.matches;
    mainEl.inert = isOverlayOpen;
    if(usageEl) usageEl.inert = isOverlayOpen;
    if(isOverlayOpen) panelEl.setAttribute('aria-modal', 'true');
    else panelEl.removeAttribute('aria-modal');
  }

  // 패널을 열거나 이미 열린 패널의 내용을 바꾼다. 같은 프로젝트면 아무것도 하지 않는다 —
  // 재로딩하면 읽던 대시보드의 스크롤 위치가 사라진다(결정 SP8).
  function openDetailPanel(dashboardKey, displayName, openerElement, isPreviousTask){
    if(dashboardKey === openDashboardKey) return;
    // 닫는 중(지연 창)에 들어온 클릭 — 예약을 취소하지 않으면 방금 연 패널의 문서를 그 타이머가
    // 지운다. 이 한 줄이 "대기 타이머 ⇒ 닫힘" 불변식의 유일한 보존 지점이다(SP15).
    if(panelBlankTimerId !== null){ clearTimeout(panelBlankTimerId); panelBlankTimerId = null; }
    var wasClosed = openDashboardKey === null;
    openDashboardKey = dashboardKey;
    panelTitleEl.textContent = displayName;
    // 열 때 1회 판정한다(결정 GN6, 승인 항목 5) — 다른 카드로 교체할 때도 함께 갱신된다.
    // 안내 줄은 문구·data-tooltip 을 마크업에 고정해 두고 클래스만 토글한다(PV3·PV4) —
    // 자리는 항상 예약돼 있어 프로젝트를 바꿔도 헤더 높이가 변하지 않는다.
    panelNoteEl.classList.toggle(DETAIL_NOTE_VISIBLE_CLASS, isPreviousTask);
    loadPanelDocument(projectDashboardUrl(dashboardKey));
    document.body.classList.add(PANEL_OPEN_BODY_CLASS);
    applyBackgroundInert();
    if(!wasClosed) return;                  // 내용 교체일 뿐이면 포커스를 건드리지 않는다
    panelOpenerElement = openerElement;
    panelCloseButton.focus();
  }

  // 패널을 닫고 iframe 을 비운다 — 숨은 iframe 의 5초 폴링을 반드시 멈춘다(리스크 R-6).
  // visibility:hidden 도 display:none 도 iframe 의 타이머를 멈추지 않는다. 제목은 여기서
  // 지우지 않는다 — 지우면 나가는 180ms 동안 머리가 빈 패널이 보인다(GOTCHA 16).
  function closeDetailPanel(){
    if(openDashboardKey === null) return;   // 여기서 반환되므로 대기 타이머는 존재할 수 없다(SP15)
    openDashboardKey = null;
    document.body.classList.remove(PANEL_OPEN_BODY_CLASS);
    applyBackgroundInert();                 // 포커스 복귀보다 먼저 — inert 안의 요소는 포커스를 못 받는다
    scheduleBlankAfterSlide();
    if(panelOpenerElement && panelOpenerElement.isConnected) panelOpenerElement.focus();
    panelOpenerElement = null;
  }

  panelCloseButton.addEventListener('click', closeDetailPanel);
  // 비모달 패널이라 브라우저가 ESC 를 대신 처리해 주지 않는다(SP1). iframe 안에 포커스가
  // 있으면 keydown 이 그 문서로 가 여기 오지 않는다 — 그래서 닫기 버튼이 1차 수단이다.
  document.addEventListener('keydown', function(event){
    if(event.key === 'Escape') closeDetailPanel();
  });
  // 열어 둔 채 창 크기를 바꾸면 모드가 바뀐다 — inert·aria-modal 을 다시 계산한다.
  pushModeQuery.addEventListener('change', applyBackgroundInert);

  document.addEventListener('click', function(event){
    if(event.target.closest('.card-drag-handle')) return;         // 결정 N6 — 드래그 핸들은 별도 조작
    if((window.getSelection() || {}).toString()) return;          // 결정 N6 — 텍스트 선택 후 클릭 무시
    var card = event.target.closest(CLICKABLE_CARD_SELECTOR);
    if(!card) return;
    var nameEl = card.querySelector('.project-name');
    var isPreviousTask = card.getAttribute(TIER1_PREVIOUS_TASK_ATTRIBUTE) === '1';
    openDetailPanel(card.getAttribute(DASHBOARD_KEY_ATTRIBUTE),
                    nameEl ? nameEl.textContent : '', nameEl || card, isPreviousTask);
  });
})();
</script>
</body>
</html>
